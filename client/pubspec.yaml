name: codex_link
description: "A personal Codex remote client for Android, iOS and Web."
publish_to: 'none'
version: 0.2.0+11

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^2.0.0
  file_picker: ^13.1.0
  file_picker_web: ^4.2.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  pub_semver: ^2.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.2
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
